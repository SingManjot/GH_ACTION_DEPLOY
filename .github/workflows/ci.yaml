name: 01- Type 1 workflow inputs

on:
    workflow_dispatch:
        inputs:
            environment:
                description: Deployment environment
                required: true
                default: dev
                type: choice
                options:
                    - dev
                    - qa
                    - prod
            
            perform_smoke_test:
                description: Execute smoke test
                required: true
                type: boolean
                default: true

env:
    APPLICATION_NAME: manjot-flask-app
    DOCKER_USERNAME: smanjot444
    IMAGE_TAG: V1.0.1

jobs:
    flask-ci-job:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repo
              uses: actions/checkout@v6

            - name: Display User Inputs
              run: |
                echo "Environment: ${{ inputs.environment }}"
                echo "Perform Smoke Test: ${{ inputs.perform_smoke_test }}"

            - name: Build Docker Image
              uses: docker/build-push-action@v7
              with:
                context: .
                push: false
                tags: ${{ env.DOCKER_USERNAME }}/${{ env.APPLICATION_NAME }}:${{ env.IMAGE_TAG }}

            - name: QA Validation
              if: ${{ inputs.environment == 'qa' }}
              run: |
                echo "Running QA Validation checks..."
                echo "Running secutiry validation..."
                echo "Running integrarion validation..."
                echo "QA validation completed successfully."
            
            - name: Login to Dockerhub
              if: ${{ inputs.environment != 'dev' }}
              uses: docker/login-action@v3
              with:
                username: ${{ env.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_TOKEN }}
            
            - name: Push Docker Images
              if: ${{ inputs.environment != 'dev' }}
              uses: docker/build-push-action@v7
              with:
                context: .
                push: true
                tags: ${{ env.DOCKER_USERNAME }}/${{ env.APPLICATION_NAME }}:${{ env.IMAGE_TAG }}
            
            - name: Run container
              run: |
                docker run -d \
                -p 5000:5000
                --name flask-container \
                ${{ env.DOCKER_USERNAME }}/${{ env.APPLICATION_NAME }}:${{ env.IMAGE_TAG }}

            - name: Smoke test
              if: ${{ inputs.environment }}
              run: |
                sleep 5
                curl http://localhost:5000/health
                echo "smoke test completed successfully"
            
            - name: Deploy to Kubernetes
              if: ${{ inputs.environment == 'prod' }}
              run: |
                echo "Deploying application to Prod kubernetes cluster"
                echo "Deployment completed successfully"
                
