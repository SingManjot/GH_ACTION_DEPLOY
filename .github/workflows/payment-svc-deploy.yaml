name: Calling Payment svc Workflow

on: 
    workflow_dispatch

jobs:
    run-unit-tests-job:
        runs-on: ubuntu-latest

        steps:
            - name: Execute Unit tests
              run: |
                echo "Running all the unit tests"
                echo "All tests have passed"
        
    build-payment-artifacts-job:
        runs-on: ubuntu-latest
        needs: [ run-unit-tests-job ]

        steps:
            - name: Build Payment Artifacts
              run: |
                echo "Building payment artifacts"
                echo "Artifacts generated successfully"
            
    deploy-payment-svc-job:
        needs: [ build-payment-artifacts-job ]
        uses: ./.github/workflows/deploy-reusable.yaml
        with:
            application_name: payment-svc
            run_security_scan: true
            replicas: 3
